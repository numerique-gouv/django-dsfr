{% load static %}
<script type="module"
        src="{% static DsfrStaticAssets.DSFR_MODULE_JS %}"
        {% if self.USE_INTEGRITY_CHECKSUMS and self.INTEGRITY_JS_MODULE %}integrity="{{ self.INTEGRITY_JS_MODULE }}" crossorigin="anonymous"{% endif %}
        {% if self.nonce %} nonce="{{self.nonce}}"{% endif %}></script>
<script nomodule
        src="{% static DsfrStaticAssets.DSFR_NOMODULE_JS %}"
        {% if self.USE_INTEGRITY_CHECKSUMS and self.INTEGRITY_JS_NOMODULE %}integrity="{{ self.INTEGRITY_JS_NOMODULE }}" crossorigin="anonymous"{% endif %}
        {% if self.nonce %} nonce="{{self.nonce}}"{% endif %}></script>
